name: Hosted default Chrome public V16 production witness
on:
  workflow_dispatch:
    inputs:
      run_bounded_public_production_probe:
        type: boolean
        default: false
        description: Use existing default Chrome on the public bounded real route; no installs or audio
permissions:
  contents: read
jobs:
  probe:
    if: inputs.run_bounded_public_production_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Existing default Chrome public production proof
        timeout-minutes: 5
        run: node scripts/v16_production_browser_probe.mjs
      - name: Preserve original public witness and bounded request diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v16-public-production-browser-${{ github.run_id }}
          path: evidence/v16-production-browser/
          retention-days: 3
          if-no-files-found: error
