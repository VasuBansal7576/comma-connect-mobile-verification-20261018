# Owner-reviewed inventory only. No installs, SDK license operations, emulator or audio launch.
name: Existing Android runner inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Read existing SDK and audio prerequisites only
        run: python3 android/inventory.py --sdk-root /usr/local/lib/android/sdk --output evidence/android-existing-resources.json
      - name: Retain bounded nonsecret inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: existing-android-resources-${{ github.run_id }}
          path: evidence/android-existing-resources.json
          retention-days: 3
          if-no-files-found: error
